# PowderPilot H5 前端 + API 反向代理
#
# 为什么要 Nginx 而不是让前端直连后端：
#   1. 同源（前端与 API 都从 80 端口进）→ 不用配 CORS，也不会有跨域坑
#   2. SSE 流式必须经过反代时才需要特殊配置（见下面 proxy_buffering off），
#      这一段配错的现象很有迷惑性：**回答不是打字的，而是等十几秒后一次全冒出来**
#   3. 静态资源缓存、gzip 这些顺手就有了

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA：直接访问 /pages/trip/trip 这类路径时，找不到文件就回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # uni-app 打包产物带 hash，可以长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API 反向代理：前端生产环境用相对路径 /api/v1，所以这里是同源
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # ⚠️ 这三行是 SSE 打字机效果的关键：不关缓冲就变成"憋一会儿一次全出"
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 一轮对话可能 90 秒以上（工具调用 + 引用校验打回重写），别用默认 60s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
