# ---------------- 拒答（库里没有，必须返回空而不是硬答） ----------------
- id: r01
  kind: refusal
  question: 二世谷雪票多少钱
  # 这条用例曾经是红的，值得记住它教了什么：
  #   守卫原来靠 "XX滑雪场" 后缀识别未收录雪场，本问句没带后缀 → 守卫不触发，
  #   只能靠向量距离阈值兜底。只有一个雪场时兜得住，加入第二个雪场后
  #   它会把丝绸之路的价格答给问二世谷的人。
  #   修复：新增策展名单 data/uncovered_resorts.yaml（79 个名称/别名），
  #   守卫先查名单、再用后缀正则兜底。名单里刻意只写具体雪场名、
  #   不写地区名，否则"崇礼的雪场哪个适合新手"这类正常泛问会被误杀。

- id: r02
  kind: refusal
  question: 南山滑雪场雪票多少钱
  # 本节两条拒答用例已被自动体检（audit_refusal_cases）抓过两次：
  # 原问太舞 → 太舞收录后失效；改问多乐美地 → 多乐美地也收录了 → 现在换成南山。
  # 结论：**收录范围一动，拒答用例必须同步换**，靠人工记必然漏。

- id: r03
  kind: refusal
  question: 怎么注册一家公司

- id: r04
  kind: refusal
  question: 推荐一部滑雪电影

