# ============================================================
# 评估集（Golden Set）：把"检索效果还行"变成可复现的数字
#
# 用法：python -m scripts.evaluate
#
# 字段说明：
#   id            用例编号
#   kind          retrieval（应召回到证据）/ refusal（库里没有，应拒答）
#   question      用户问题
#   level/board   可选的过滤条件（模拟用户画像）
#   expect_any    命中判定：任意一组子串全部出现在同一条 chunk 里，即算命中
#                 （比写死 chunk_id 稳：改文案不会让用例全挂）
# ============================================================

# ---------------- 结构化统计类（应走 SQL，但检索也要能召回总览） ----------------
# 注：2026-09 换真实数据后，期望值同步更新（原来是示例数据的 35 条 / 高级 15 条）。
#     这正是评估集的作用：数据一改，写死旧值的用例立刻变红，提醒你"基线和数据必须同源"。
- id: q01
  kind: retrieval
  question: 万龙有几条高级道
  expect_any:
    - ['高级道', '19']
    - ['共 32 条雪道']

- id: q02
  kind: retrieval
  question: 万龙一共有多少条雪道
  expect_any:
    - ['32 条雪道']
    # 总览已经写明两个口径：来源总数 22 条雪道，分级合计 32 条。
    # 两个数在同一条里才算答到这件事，不能只看出现了 32。
    - ['22 条雪道', '分级统计合计 32']

# ---------------- 专有名词（BM25 的主场） ----------------
- id: q03
  kind: retrieval
  question: 金龙道难不难
  expect_any:
    - ['金龙道']

- id: q04
  kind: retrieval
  question: 银龙道适合练什么
  expect_any:
    # 新的真实档案里，银龙道是中庸的一条（平均 12 度/最大 15 度）；
    # 官方源没给"适合练什么"的经验描述，所以只断言能召回这条雪道本身
    - ['银龙道', '中级']

- id: q05
  kind: retrieval
  question: 长龙道有什么要注意的
  expect_any:
    - ['长龙道']

# ---------------- 价格（带录入日期） ----------------
# 注：期望值改为 2025-2026 雪季真实门市价（480/380 是旧的示例值）
- id: q06
  kind: retrieval
  question: 万龙雪票多少钱
  expect_any:
    - ['雪票', '560']
    - ['雪票', '650']

- id: q07
  kind: retrieval
  question: 万龙租一套雪具多少钱
  expect_any:
    - ['雪具租赁', '200']
    - ['雪具租赁', '300']

- id: q08
  kind: retrieval
  question: 万龙的夜场雪票多少钱
  expect_any:
    - ['夜场', '268']

