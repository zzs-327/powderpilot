# ---------------- 口径冲突难例（2026-10-07 新增） ----------------
# 这三座的档案里都留有"来源之间打架"的证据。正确的召回目标不是某个数字，
# 而是那条**说明口径冲突、明确不下断言**的 chunk——给单一数字反而是错。
- id: h01
  kind: retrieval
  question: 北大湖一共有几条雪道
  expect_any:
    # 同一条 chunk 里必须同时出现"来源总数 74"与"分级合计 33"：
    # 只给其中一个数（74 或 33）都不算命中，这正是复合口径的考点
    - ['74 条雪道', '33 条']

- id: h02
  kind: retrieval
  question: 丝绸之路有几条雪道
  expect_any:
    - ['不对总数做断言']
    - ['来源之间不一致']

- id: h03
  kind: retrieval
  question: 松花湖有几条高级道
  # 松花湖只有总数口径（50 条），没有分级数字；应召回到那条"不能给分级数字"的说明
  expect_any:
    - ['不能给分级数字']

