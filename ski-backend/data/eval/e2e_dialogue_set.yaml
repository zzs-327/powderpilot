version: 2
questions:
  - id: dialogue_missing_price
    kind: price_missing
    question: 请仅根据本库介绍北大湖是否已收录。
    followup: 那它自带板平日全天票价呢？如果缺价格就说明，别借其他雪场。
    expect_groups:
      - ['北大湖']
      - ['暂无', '没有', '未收录', '无法']
    forbid_patterns: ['该雪场未收录', '560\s*元']
    review: '省略应承接北大湖且本轮查工具；只缺价格而非雪场未收录。'
  - id: dialogue_multi_runs
    kind: multi_runs
    question: 请分别给万龙和太舞的高级雪道数量，各自给出处，不能把两场混在一起。
    expect_groups:
      - ['万龙']
      - ['太舞']
      - ['19', '十九']
      - ['6', '六']
    review: '万龙高级19，太舞高级6，两场来源编号须互不相同，人工检查对象数字对应。'
  - id: dialogue_switch_lift
    kind: lift_missing
    question: 万龙有多少高级道？只用本库资料。
    followup: 换到太舞吧，它的缆车名称和长度呢？如果没有档案别猜。
    expect_groups:
      - ['太舞']
      - ['未收录', '暂无', '无法', '没有']
    forbid_patterns: ['22\s*条缆车', '(?:^|[。！？])\s*太舞(?:滑雪小镇)?没有缆车']
    review: '本轮明确换场优先，不承接万龙，不以太舞22雪道替代缆车；缺档可引用E601。'
