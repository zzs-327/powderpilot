<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雪场场景视觉验收</title><style>body{margin:0;background:#edf3f8;font:14px system-ui;color:#17394d}header{padding:16px 24px;background:#13374b;color:white}button{margin:8px;padding:10px;border:1px solid #7796a3;border-radius:8px;background:white;color:#17394d}#terrain{height:72vh;position:relative;overflow:hidden}.terrain-label,.terrain-landmark,.terrain-summit{position:absolute;transform:translate(-50%,-50%);padding:4px 7px;background:#ffffffdd;border-radius:6px;font-size:10px;white-space:nowrap}.terrain-label{border:1px solid var(--marker-color);cursor:pointer}.terrain-landmark{background:#183e59bb;color:white}.terrain-label.is-selected{background:#fff3b0}#status{padding:8px 24px}footer{padding:10px 24px}</style><header><strong>万龙 · 三维雪场样板</strong>　视觉精细化 · 非实测地形</header><nav><button id="all">全部设施</button><button id="beginner">只看初级道</button><button id="reset">重置视角</button><button id="focus">聚焦长龙道</button><button id="focusadv">聚焦风龙道</button><button id="dispose">销毁重建</button></nav><div id="terrain"></div><div id="status">正在加载场景</div><footer>山体、宽度、坡面与动态设施仅视觉示意，不用于现场导航；业务信息仍来自档案。</footer><script type="module">import {mountTerrain} from '../utils/terrain.js';import {WANLONG_PROFILE,routeFor} from '../utils/wanlong.js';import {buildView,levelOf} from '../utils/graph.js';const graph=await fetch('../static/graph/graph.json').then(r=>r.json());const view=buildView(graph,'wanlong');const seen={};const entities=view.nodes.filter(n=>n.type==='run'||n.type==='lift').map(n=>{const level=levelOf(view,n.id)||'other';const key=n.type==='lift'?'lift':level;const i=seen[key]||0;seen[key]=i+1;const e={id:n.id,label:n.label,type:n.type,level};return {...e,points:routeFor(WANLONG_PROFILE,e,i).points}});let instance;async function mount(){try{instance=await mountTerrain(document.querySelector('#terrain'),entities,id=>{document.querySelector('#status').textContent='已选择 '+id},{profile:WANLONG_PROFILE});document.querySelector('#status').textContent='加载成功 · '+entities.length+' 个档案实体 · 本地三维库'}catch(e){document.querySelector('#status').textContent='加载失败 '+e.message;console.error(e)}}await mount();document.querySelector('#all').onclick=()=>instance.setFilter('all');document.querySelector('#beginner').onclick=()=>instance.setFilter('beginner');document.querySelector('#reset').onclick=()=>instance.reset();document.querySelector('#focus').onclick=()=>{const e=entities.find(x=>x.label==='长龙道');document.querySelector('#status').textContent='focus 长龙道 → '+instance.focus(e.id)};document.querySelector('#focusadv').onclick=()=>{const e=entities.find(x=>x.label==='风龙道');document.querySelector('#status').textContent='focus 风龙道 → '+instance.focus(e.id)};document.querySelector('#dispose').onclick=async()=>{instance.dispose();await mount()};</script></html>
